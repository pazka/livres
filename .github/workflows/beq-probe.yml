name: beq-probe (temporary, removed before merge)
on:
  push:
    branches: [claude/project-thread-czlc0k]
    paths: [.github/workflows/beq-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from livres.http import PoliteHttpClient
          c = PoliteHttpClient("LivresHoshBot/0.1 (+https://livres.hosh.it/robots-info)")
          H = ("beq.ebooksgratuits.com",)
          r = c.get("https://beq.ebooksgratuits.com/robots.txt", allowed_hosts=H) if True else None
          print("=== robots", r.status, r.headers.get("content-type")); print(r.body.decode("latin-1")[:3000].replace(chr(10)," | "))
          import base64
          for p in ["index.htm", "vents/index.htm", "classiques/index.htm", "pdf/index.htm"]:
              r = c.get("https://beq.ebooksgratuits.com/" + p, allowed_hosts=H)
              b = base64.b64encode(r.body[:120000]).decode()
              print("=== B64", p, len(r.body))
              for i in range(0, len(b), 4000):
                  print("B64LINE", b[i:i+4000])
              print("=== END", p)
          PY
