name: beq-probe (temporary, removed before merge)
on:
  push:
    branches: [claude/project-thread-czlc0k]
    paths: [.github/workflows/beq-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from livres.http import PoliteHttpClient
          c = PoliteHttpClient("LivresHoshBot/0.1 (+https://livres.hosh.it/robots-info)")
          H = ("beq.ebooksgratuits.com",)
          r = c.get("https://beq.ebooksgratuits.com/robots.txt", allowed_hosts=H) if True else None
          print("=== robots", r.status, r.headers.get("content-type")); print(r.body.decode("latin-1")[:3000].replace(chr(10)," | "))
          import json
          for host in ("www.wikidata.org", "fr.wikipedia.org"):
              r = c.get(f"https://{host}/robots.txt", allowed_hosts=(host,))
              t = r.body.decode("utf-8", "replace")
              print("=== ROBOTS", host, len(t))
              block = False
              for line in t.splitlines():
                  if line.lower().startswith("user-agent"):
                      block = line.split(":",1)[1].strip() == "*"
                  if block or "api" in line.lower():
                      print("  ", line)
          for u in ["https://fr.wikipedia.org/w/api.php?action=query&format=json&prop=pageprops&ppprop=wikibase_item&redirects=1&titles=Am%C3%A9d%C3%A9e_Achard%7CLaure_Junot_d%27Abrant%C3%A8s",
                    "https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&props=claims&ids=Q2842470"]:
              h = (u.split("/")[2],)
              print("=== CAN", u, c.allowed_by_robots(u, h))
              try:
                  r = c.get(u, allowed_hosts=h)
                  print(r.body[:1500].decode())
              except Exception as e:
                  print("FAIL", e)
          PY
