# livres on the hosh.it box (no secrets here). On the box it becomes /srv/livres/docker-compose.yml,
# validated and pinned by `hosh-deploy register` (any later change needs a re-register).
# Every site-specific value comes from livres.env (interpolation AND container env).
# Box standard (hosh-migration 11-BOX-STANDARD.md): published on a LOOPBACK port only; the edge
# Traefik (host network, file provider) routes livres.hosh.it to it (route rendered by hosh-deploy from deploy/traefik-route.yml.tmpl).
# hosh-deploy refuses: root user, writable rootfs, missing cap_drop ALL / no-new-privileges /
# healthcheck, privileged, host network/pid/ipc, devices, bind mounts, non-loopback ports.
name: livres            # fixed compose project name (whatever the checkout dir)
services:
  livres:
    image: ${APP_IMAGE:-ghcr.io/pazka/livres:latest}
    container_name: livres
    restart: unless-stopped
    env_file: ./livres.env          # chmod 600
    volumes:
      - livres-data:/data           # ALL state lives here (backed up monthly with /var/lib/docker/volumes)
    # --- hardening (box standard; relax only with a written reason in DEPLOY.md) ---
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      # adapt the command to the image (python / wget / node …); must hit GET /healthz
      test: ["CMD", "python", "-m", "livres.cli", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "${APP_BIND:-127.0.0.1:9133}:8000"   # loopback only — never 0.0.0.0

volumes:
  livres-data:
    name: livres-data       # exact docker volume name
