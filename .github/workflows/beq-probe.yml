name: beq-probe (temporary, removed before merge)
on:
  push:
    branches: [claude/project-thread-czlc0k]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Live check (AGENTS.md P1a step 5)
        env:
          PYTHONPATH: src
        run: |
          python -m livres.cli check --source beq --json || true
          python - <<'PY'
          import collections, json
          from livres.config import Settings
          from livres.http import PoliteHttpClient
          from livres.sources import build_adapter, load_specs
          from pathlib import Path
          spec = next(s for s in load_specs(Path("sources")) if s.id == "beq")
          books = list(build_adapter(spec, PoliteHttpClient("LivresHoshBot/0.1 (+https://livres.hosh.it/robots-info)")).harvest())
          print("BOOKS", len(books))
          print(collections.Counter(b.authors[0] for b in books).most_common(60))
          for b in books[::25]:
              print(" ", b.identifier, "|", b.title, "|", b.authors, "|", [a.href for a in b.sorted_acquisitions()][:1])
          PY
