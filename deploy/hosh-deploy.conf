# Read ONCE by `hosh-deploy register livres` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/livres.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=livres
IMAGE_REPO=ghcr.io/pazka/livres
IMAGE_VAR=APP_IMAGE
ENV_FILE=livres.env
HOST=livres.hosh.it
BIND=127.0.0.1:9133
HEALTH=/healthz
# Optional capability smoke run INSIDE the container after each deploy (non-zero ⇒ auto-rollback).
# Run as a plain argv (split on spaces, NO shell: no pipes, quotes, globs or $VARS), so it works in distroless images.
# e.g. POST_DEPLOY=python scripts/smoke.py http://127.0.0.1:8000
POST_DEPLOY=python -m livres.cli smoke http://127.0.0.1:8000
REPO=pazka/livres
